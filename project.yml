name: VTuTRADE
options:
  bundleIdPrefix: com.miyukidesign
  deploymentTarget:
    iOS: '17.0'
targets:
  VTuTRADE:
    type: application
    platform: iOS
    sources: [VTuTRADE]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.miyukidesign.vtutrade
        SWIFT_VERSION: '5.9'
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: VTuTRADE
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsArbitraryLoads: NO
        TARGETED_DEVICE_FAMILY: '1'
        CODE_SIGN_STYLE: Automatic
