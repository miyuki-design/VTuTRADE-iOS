name: VTuTRADE iOS to TestFlight

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 60

    env:
      TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      BUNDLE_ID: com.miyukidesign.vtutrade
      API_KEY_ID: ${{ vars.APPSTORE_API_KEY_ID }}
      API_ISSUER_ID: ${{ vars.APPSTORE_ISSUER_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

            - name: Diagnose P12 certificate
        env:
          CERTIFICATE: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
        run: |
          set -euo pipefail

          echo "===== STEP 1: Secret確認 ====="

          if [ -z "$CERTIFICATE" ]; then
            echo "❌ P12のBase64が空です"
            exit 1
          fi

          if [ -z "$CERT_PASSWORD" ]; then
            echo "❌ P12パスワードが空です"
            exit 1
          fi

          echo "✅ 両方のSecretが存在します"

          echo "===== STEP 2: Base64確認 ====="

          printf '%s' "$CERTIFICATE" |
            base64 --decode > "$RUNNER_TEMP/check.p12"

          echo "✅ Base64変換成功"

          echo "===== STEP 3: P12検証 ====="

          if openssl pkcs12 \
            -in "$RUNNER_TEMP/check.p12" \
            -noout \
            -passin env:CERT_PASSWORD
          then
            echo "✅ P12ファイルとパスワードは一致しています"
          else
            echo "❌ P12の検証に失敗しました"
            exit 1
          fi

          echo "===== STEP 4: 暗号化方式 ====="

          openssl pkcs12 \
            -in "$RUNNER_TEMP/check.p12" \
            -info \
            -noout \
            -passin env:CERT_PASSWORD \
            2>&1 |
            grep -E 'MAC:|PKCS7 Encrypted data:|Shrouded Keybag:'

          rm -f "$RUNNER_TEMP/check.p12"

      - name: Install signing certificate and profile
        env:
          CERTIFICATE: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          PROFILE: ${{ secrets.IOS_APPSTORE_PROFILE_BASE64 }}
        run: |
          set -euo pipefail

          echo "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          echo "$PROFILE" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"

          security create-keychain -p "" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security unlock-keychain -p "" build.keychain

          security import "$RUNNER_TEMP/cert.p12" \
            -k build.keychain \
            -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign

          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s -k "" build.keychain

          security list-keychains -d user -s build.keychain

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"

          PROFILE_UUID=$(
            security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" \
            | plutil -extract UUID raw -
          )

          cp "$RUNNER_TEMP/profile.mobileprovision" \
            "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"

      - name: Install App Store Connect API key
        env:
          API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.appstoreconnect/private_keys"

          printf '%s\n' "$API_PRIVATE_KEY" \
            > "$HOME/.appstoreconnect/private_keys/AuthKey_${API_KEY_ID}.p8"

          chmod 600 \
            "$HOME/.appstoreconnect/private_keys/AuthKey_${API_KEY_ID}.p8"

      - name: Archive iOS app
        run: |
          set -euo pipefail

          xcodebuild archive \
            -project VTuTRADE.xcodeproj \
            -scheme VTuTRADE \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/VTuTRADE.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_UUID" \
            CODE_SIGN_IDENTITY="Apple Distribution"

      - name: Create export options
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
          "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>${TEAM_ID}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>${BUNDLE_ID}</key>
              <string>${PROFILE_UUID}</string>
            </dict>
          </dict>
          </plist>
          EOF

      - name: Export IPA
        run: |
          set -euo pipefail

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/VTuTRADE.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

      - name: Upload to TestFlight
        run: |
          set -euo pipefail

          IPA=$(find "$RUNNER_TEMP/export" -name "*.ipa" -print -quit)

          test -n "$IPA"

          xcrun altool --upload-app \
            --type ios \
            --file "$IPA" \
            --apiKey "$API_KEY_ID" \
            --apiIssuer "$API_ISSUER_ID"

      - name: Cleanup signing files
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/cert.p12"
          rm -f "$RUNNER_TEMP/profile.mobileprovision"
          rm -f "$HOME/.appstoreconnect/private_keys/AuthKey_${API_KEY_ID}.p8"
          security delete-keychain build.keychain 2>/dev/null || true
