name: VTuTRADE iOS to TestFlight

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 60

    env:
      TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      BUNDLE_ID: com.miyukidesign.vtutrade
      API_KEY_ID: ${{ vars.APPSTORE_API_KEY_ID }}
      API_ISSUER_ID: ${{ vars.APPSTORE_ISSUER_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 26
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26'

      - name: Verify Xcode and SDK
        run: |
          set -euo pipefail

          echo "===== Xcode ====="
          xcodebuild -version

          echo "===== iOS SDK ====="
          SDK_VERSION=$(xcrun --sdk iphoneos --show-sdk-version)
          echo "$SDK_VERSION"

          SDK_MAJOR="${SDK_VERSION%%.*}"

          if [ "$SDK_MAJOR" -lt 26 ]; then
            echo "❌ iOS 26 SDK以降が必要です"
            exit 1
          fi

          echo "✅ XcodeとiOS SDKの確認完了"

      - name: Install build tools
        run: |
          set -euo pipefail

          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi

          if ! brew list --versions openssl@3 >/dev/null 2>&1; then
            brew install openssl@3
          fi

          OPENSSL3="$(brew --prefix openssl@3)/bin/openssl"

          "$OPENSSL3" version
          xcodegen --version

      - name: Verify app icon source
        run: |
          set -euo pipefail

          ICON="VTuTRADE/Assets.xcassets/AppIcon.appiconset/AppIcon.png"
          CONTENTS="VTuTRADE/Assets.xcassets/AppIcon.appiconset/Contents.json"

          if [ ! -f "$ICON" ]; then
            echo "❌ AppIcon.png が見つかりません"
            echo "必要な場所: $ICON"
            exit 1
          fi

          if [ ! -f "$CONTENTS" ]; then
            echo "❌ Contents.json が見つかりません"
            echo "必要な場所: $CONTENTS"
            exit 1
          fi

          WIDTH=$(sips -g pixelWidth "$ICON" | awk '/pixelWidth/ {print $2}')
          HEIGHT=$(sips -g pixelHeight "$ICON" | awk '/pixelHeight/ {print $2}')

          if [ "$WIDTH" != "1024" ] || [ "$HEIGHT" != "1024" ]; then
            echo "❌ アイコンは1024×1024ピクセルにしてください"
            echo "現在: ${WIDTH}×${HEIGHT}"
            exit 1
          fi

          echo "✅ アプリアイコン確認完了"

      - name: Generate Xcode project
        run: |
          set -euo pipefail

          xcodegen generate --spec project.yml

          echo "✅ Xcodeプロジェクト生成完了"

      - name: Diagnose P12 certificate
        env:
          CERTIFICATE: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077

          OPENSSL3="$(brew --prefix openssl@3)/bin/openssl"

          echo "===== Secret確認 ====="

          if [ -z "$CERTIFICATE" ] || [ -z "$CERT_PASSWORD" ]; then
            echo "❌ 証明書またはパスワードが未設定です"
            exit 1
          fi

          printf '%s' "$CERTIFICATE" \
            | base64 --decode \
            > "$RUNNER_TEMP/check.p12"

          "$OPENSSL3" pkcs12 \
            -in "$RUNNER_TEMP/check.p12" \
            -noout \
            -passin env:CERT_PASSWORD

          echo "✅ P12ファイルとパスワードの一致を確認"

          rm -f "$RUNNER_TEMP/check.p12"

      - name: Install signing certificate and profile
        env:
          CERTIFICATE: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          PROFILE: ${{ secrets.IOS_APPSTORE_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077

          OPENSSL3="$(brew --prefix openssl@3)/bin/openssl"

          echo "===== 証明書の復元 ====="

          printf '%s' "$CERTIFICATE" \
            | base64 --decode \
            > "$RUNNER_TEMP/cert.p12"

          printf '%s' "$PROFILE" \
            | base64 --decode \
            > "$RUNNER_TEMP/profile.mobileprovision"

          echo "===== P12互換形式への変換 ====="

          "$OPENSSL3" pkcs12 \
            -in "$RUNNER_TEMP/cert.p12" \
            -noenc \
            -passin env:CERT_PASSWORD \
            -out "$RUNNER_TEMP/cert.pem"

          "$OPENSSL3" pkcs12 \
            -export \
            -legacy \
            -in "$RUNNER_TEMP/cert.pem" \
            -out "$RUNNER_TEMP/cert-legacy.p12" \
            -passout env:CERT_PASSWORD

          echo "===== Keychain作成 ====="

          security create-keychain \
            -p "" \
            "$RUNNER_TEMP/build.keychain-db"

          security set-keychain-settings \
            -lut 21600 \
            "$RUNNER_TEMP/build.keychain-db"

          security unlock-keychain \
            -p "" \
            "$RUNNER_TEMP/build.keychain-db"

          echo "===== 証明書のインポート ====="

          security import "$RUNNER_TEMP/cert-legacy.p12" \
            -k "$RUNNER_TEMP/build.keychain-db" \
            -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign

          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "" \
            "$RUNNER_TEMP/build.keychain-db"

          security list-keychains \
            -d user \
            -s "$RUNNER_TEMP/build.keychain-db"

          security default-keychain \
            -d user \
            -s "$RUNNER_TEMP/build.keychain-db"

          echo "===== 署名ID確認 ====="

          security find-identity \
            -v -p codesigning \
            "$RUNNER_TEMP/build.keychain-db"

          echo "===== Provisioning Profile登録 ====="

          mkdir -p \
            "$HOME/Library/MobileDevice/Provisioning Profiles"

          PROFILE_UUID=$(
            security cms \
              -D \
              -i "$RUNNER_TEMP/profile.mobileprovision" \
              | plutil -extract UUID raw -
          )

          cp "$RUNNER_TEMP/profile.mobileprovision" \
            "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"

          rm -f "$RUNNER_TEMP/cert.pem"
          rm -f "$RUNNER_TEMP/cert-legacy.p12"

          echo "✅ 証明書とプロファイルの設定完了"

      - name: Install App Store Connect API key
        env:
          API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077

          mkdir -p \
            "$HOME/.appstoreconnect/private_keys"

          printf '%s\n' "$API_PRIVATE_KEY" \
            > "$HOME/.appstoreconnect/private_keys/AuthKey_${API_KEY_ID}.p8"

          echo "✅ App Store Connect APIキー設定完了"

      - name: Archive iOS app
        run: |
          set -euo pipefail

          xcodebuild archive \
            -project VTuTRADE.xcodeproj \
            -scheme VTuTRADE \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/VTuTRADE.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_UUID" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            MARKETING_VERSION="1.0.0" \
            CURRENT_PROJECT_VERSION="${GITHUB_RUN_NUMBER}"

          echo "✅ iOSアーカイブ作成完了"

      - name: Verify archived app
        run: |
          set -euo pipefail

          APP="$RUNNER_TEMP/VTuTRADE.xcarchive/Products/Applications/VTuTRADE.app"
          PLIST="$APP/Info.plist"

          test -f "$PLIST"

          echo "===== アプリ情報 ====="

          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleIdentifier" "$PLIST"

          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleShortVersionString" "$PLIST"

          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleVersion" "$PLIST"

          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleIconName" "$PLIST"

          echo "===== アイコン確認 ====="

          if [ ! -f "$APP/Assets.car" ]; then
            echo "❌ Assets.car が見つかりません"
            exit 1
          fi

          echo "✅ アプリ情報とAsset Catalogを確認"

      - name: Create export options
        run: |
          set -euo pipefail

          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
          "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>${TEAM_ID}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>${BUNDLE_ID}</key>
              <string>${PROFILE_UUID}</string>
            </dict>
          </dict>
          </plist>
          EOF

          echo "✅ ExportOptions.plist作成完了"

      - name: Export IPA
        run: |
          set -euo pipefail

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/VTuTRADE.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

          echo "✅ IPA書き出し完了"

      - name: Upload to TestFlight
        run: |
          set -euo pipefail

          IPA=$(find "$RUNNER_TEMP/export" \
            -name "*.ipa" \
            -print \
            -quit)

          if [ -z "$IPA" ]; then
            echo "❌ IPAファイルが見つかりません"
            exit 1
          fi

          echo "===== TestFlightアップロード開始 ====="

          xcrun altool --upload-app \
            --type ios \
            --file "$IPA" \
            --apiKey "$API_KEY_ID" \
            --apiIssuer "$API_ISSUER_ID"

          echo "✅ TestFlightアップロード完了"

      - name: Cleanup signing files
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/cert.p12"
          rm -f "$RUNNER_TEMP/cert.pem"
          rm -f "$RUNNER_TEMP/cert-legacy.p12"
          rm -f "$RUNNER_TEMP/check.p12"
          rm -f "$RUNNER_TEMP/profile.mobileprovision"

          rm -f \
            "$HOME/.appstoreconnect/private_keys/AuthKey_${API_KEY_ID}.p8"

          if [ -n "${PROFILE_UUID:-}" ]; then
            rm -f \
              "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          fi

          security delete-keychain \
            "$RUNNER_TEMP/build.keychain-db" \
            2>/dev/null || true

          echo "✅ 一時ファイルの削除完了"
